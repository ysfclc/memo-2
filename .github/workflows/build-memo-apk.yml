name: Build Memo APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify project structure
        run: |
          set -euo pipefail
          for f in settings.gradle.kts build.gradle.kts gradle.properties \
                   app/build.gradle.kts core/build.gradle.kts \
                   gradle/wrapper/gradle-wrapper.properties; do
            [[ -f "$f" ]] || { echo "::error::Missing file: $f"; exit 1; }
          done
          echo "Project structure verified."

      - name: Enable AndroidX
        run: |
          set -euo pipefail
          if ! grep -q "android.useAndroidX=true" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi

      # We deliberately avoid android-actions/setup-android: it installs the removed
      # SDK "tools" package on some hosted runners. Use the preinstalled SDK and
      # locate sdkmanager across cmdline-tools layouts ourselves.
      - name: Configure preinstalled Android SDK
        id: android
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$sdk" ]]; then
            echo "::error::Android SDK directory not found: $sdk"
            exit 1
          fi
          manager=""
          for candidate in \
            "$sdk/cmdline-tools/latest/bin/sdkmanager" \
            "$sdk/cmdline-tools/16.0/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then manager="$candidate"; break; fi
          done
          if [[ -z "$manager" ]]; then
            manager="$(find "$sdk/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [[ -z "$manager" || ! -x "$manager" ]]; then
            echo "::error::sdkmanager not found under $sdk/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
          echo "sdkmanager=$manager" >> "$GITHUB_OUTPUT"
          echo "Using Android SDK: $sdk"
          echo "Using sdkmanager: $manager"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          "${{ steps.android.outputs.sdkmanager }}" --version
          yes | "${{ steps.android.outputs.sdkmanager }}" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "${{ steps.android.outputs.sdkmanager }}" --sdk_root="$ANDROID_HOME" \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/libs
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties', '**/build.gradle.kts', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build (core tests, app unit tests, lint, debug APK)
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :core:test testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK
        id: apk
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$apk" ]]; then
            echo "::error::APK is absent or empty."
            find app -type f -name '*.apk' -print || true
            exit 1
          fi
          file "$apk"
          sha256sum "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: List APK native libraries
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$apk" > apk-contents.txt
          unzip -l "$apk" | grep 'lib/' || true
          grep -q 'lib/arm64-v8a/libmemo_llama.so' apk-contents.txt || { echo "::error::libmemo_llama.so (arm64-v8a) missing from APK"; exit 1; }
          grep -q 'lib/x86_64/libmemo_llama.so' apk-contents.txt || { echo "::error::libmemo_llama.so (x86_64) missing from APK"; exit 1; }
          echo "Total APK size: $(stat -c %s "$apk") bytes"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: memo-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
          if-no-files-found: error
